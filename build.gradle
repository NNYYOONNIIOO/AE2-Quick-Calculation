buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
        
apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.0.0'
group = 'com.ae2vm'
archivesBaseName = 'ae2vm-1.12.2'
ext.mcVersion = '1.12.2'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

minecraft {
    // The mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   Snapshot are built nightly.
    // stable_#            Stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    //mappings channel: 'snapshot', version: '20171003-1.12'
    mappings channel: 'snapshot', version: '20171003-1.12'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
    
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }

        server {

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'

    implementation fg.deobf("curse.maven:ae2-extended-life-570458:6302098")

    def mixin = 'zone.rong:mixinbooter:11.2'
    implementation(mixin) {
        transitive = false
    }
    annotationProcessor mixin

}

def mixinRefmap = file("${buildDir}/generated/resources/main/mixins.ae2vm.refmap.json")

// ForgeGradle adds normal implementation dependencies to the Java classpath,
// but Forge's 1.12 development launcher discovers mods from run/mods. Copy
// MixinBooter there for dev runs so its mod metadata and coremod are loaded.
task copyMixinBooterToRun(type: Copy) {
    from {
        configurations.runtimeClasspath.filter { it.name == 'mixinbooter-11.2.jar' }
    }
    into project.file('run/mods')
}

task packageDevMixinResources(type: Jar) {
    archiveName = 'ae2vm-dev-mixins.jar'
    destinationDir = project.file('run/mods')
    from(project.file('src/main/resources')) {
        include 'mixins.ae2vm.json'
    }
    from(mixinRefmap) {
        include 'mixins.ae2vm.refmap.json'
    }
    dependsOn processResources
}

tasks.whenTaskAdded { task ->
    if (task.name == 'prepareRunClient' || task.name == 'prepareRunServer') {
        task.dependsOn copyMixinBooterToRun
        task.dependsOn packageDevMixinResources
    }
}

sourceSets {
    main {
        ext.refMap = 'mixins.ae2vm.refmap.json'
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ["-AoutRefMapFile=${mixinRefmap.absolutePath}"]
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.ext.mcVersion

    from(mixinRefmap) {
        into ''
    }

    // Mixin 0.8.7 requires a JAR URL for a late config. The dev-run resource
    // JAR and the final mod JAR add this file explicitly below.
    exclude 'mixins.ae2vm.json'

    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': project.ext.mcVersion
    }

    dependsOn compileJava
}

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    from(project.file('src/main/resources')) {
        include 'mixins.ae2vm.json'
    }
    from(mixinRefmap) {
        include 'mixins.ae2vm.refmap.json'
    }
    manifest {
        attributes([
            "Specification-Title": "AE2 VM",
            "Specification-Vendor": "ae2vm",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"ae2vm",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "ForceLoadAsMod": "true",
            "FMLCorePluginContainsFMLMod": "true"
        ])
    }
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar') 
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
